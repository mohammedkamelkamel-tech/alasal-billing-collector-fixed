name: Android CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Verify Gradle
        shell: bash
        run: |
          set -e
          gradle --version

      - name: Prepare signing keystore
        shell: bash
        working-directory: alasal-billing-v2-main
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -e
          KEYSTORE="${{ github.workspace }}/alasal-billing-v2-main/debug.keystore"
          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            echo "Using the saved Android signing keystore from GitHub Actions secret."
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE_BASE64 is not configured. A temporary key will be generated; Google OAuth may fail because its SHA-1 changes between builds."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "Signing certificate SHA-1:"
          keytool -list -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey | grep -E "SHA1:|SHA-1:"

      - name: Build Debug APK
        working-directory: alasal-billing-v2-main
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -e
          ls -lah alasal-billing-v2-main/app/build/outputs/apk/debug/
          test -n "$(find alasal-billing-v2-main/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ElectricityBillingAp-debug
          path: alasal-billing-v2-main/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
