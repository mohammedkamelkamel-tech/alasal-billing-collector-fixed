name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, subscriber-validation-password-biometric]

permissions:
  contents: read

jobs:
  build-apk:
    name: Build APK from current project root
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repository revision
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore stable debug keystore
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: alasal-android-oauth-debug-keystore-v1

      - name: Generate debug keystore if missing
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Verify signing certificate
        shell: bash
        run: |
          keytool -list -v -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android -alias androiddebugkey | grep -E 'SHA1:|SHA-1:'

      - name: Verify project files
        shell: bash
        run: |
          set -e
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/java/com/example/ui/screens/CollectionScreen.kt
          grep -q 'بحث برقم الفاتورة' app/src/main/java/com/example/ui/screens/CollectionScreen.kt
          grep -q 'تحصيلات \$selectedSubscriberName' app/src/main/java/com/example/ui/screens/CollectionScreen.kt

      - name: Build Debug APK from repository root
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK output
        shell: bash
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"
          unzip -t "$APK" | tail -n 2
          test "$(stat -c%s "$APK")" -gt 1000000

      - name: Upload APK built from current source
        uses: actions/upload-artifact@v4
        with:
          name: ElectricityBillingAp-debug-current-source
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
