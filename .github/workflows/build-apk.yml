name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      # Reuse the same debug keystore across builds so the OAuth SHA-1
      # remains stable while this cache entry is retained.
      - name: Restore stable debug keystore
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: alasal-billing-v2-main/debug.keystore
          key: alasal-android-oauth-debug-keystore-v1

      - name: Generate debug keystore if missing
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/alasal-billing-v2-main/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Print OAuth SHA-1 fingerprint
        run: |
          keytool -list -v \
            -keystore "$GITHUB_WORKSPACE/alasal-billing-v2-main/debug.keystore" \
            -storepass android \
            -alias androiddebugkey | grep -E 'SHA1:|SHA-1:'

      - name: Build Debug APK
        working-directory: alasal-billing-v2-main
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alasal-billing-debug-apk
          path: alasal-billing-v2-main/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
